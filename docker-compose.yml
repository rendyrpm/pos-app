services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: pos-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - pos-network
        depends_on:
            - db
            - redis

    nginx:
        image: nginx:alpine
        container_name: pos-nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - pos-network
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: pos-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        ports:
            - "3307:3306"
        volumes:
            - pos-db-data:/var/lib/mysql
        networks:
            - pos-network

    redis:
        image: redis:7-alpine
        container_name: pos-redis
        restart: unless-stopped
        ports:
            - "6380:6379"
        networks:
            - pos-network

    queue-worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: pos-queue-worker
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        volumes:
            - ./:/var/www
        networks:
            - pos-network
        depends_on:
            - app
            - db
            - redis

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: pos-scheduler
        restart: unless-stopped
        working_dir: /var/www
        command: >
            sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
        volumes:
            - ./:/var/www
        networks:
            - pos-network
        depends_on:
            - app
            - db
            - redis

networks:
    pos-network:
        driver: bridge

volumes:
    pos-db-data:
        driver: local
